server:
  port: 8080

spring:
  application:
    name: customer-manager-api

  datasource:
    url: jdbc:h2:mem:customerdb
    driverClassName: org.h2.Driver
    username: ${DB_USER:sa}
    password: ${DB_PASS:password}

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

api:
  score:
    url: http://localhost:8081

app:
  security:
    admin:
      username: ${ADMIN_USER:admin}
      password: ${ADMIN_PASS:admin123}
    user:
      username: ${APP_USER:user}
      password: ${APP_PASS:user123}